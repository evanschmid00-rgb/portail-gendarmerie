<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <title>Portail Gendarmerie — Emergency Hambourg</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
      @keyframes gh-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .gh-fade { animation: gh-fade-up 0.5s ease both; }
      .gh-btn-anim { transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease; }
      .gh-btn-anim:hover { transform: translateY(-2px); filter: brightness(1.05); }
      .gh-btn-anim:active { transform: translateY(0px) scale(0.98); }
      .gh-card-anim { transition: transform 0.2s ease, box-shadow 0.2s ease; }
      .gh-card-anim:hover { transform: translateY(-3px); }
      .gh-link-anim { transition: opacity 0.15s ease; }
      .gh-link-anim:hover { opacity: 0.75; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
